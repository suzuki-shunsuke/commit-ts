---
name: autofix.ci
on: pull_request
permissions: {}
jobs:
  autofix:
    runs-on: ubuntu-26.04
    permissions: {}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0

      - run: aqua upc -prune
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: deno fmt
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: deno check
      - run: git ls-files | xargs nllint -f -s
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}

      - uses: autofix-ci/action@v1.3.4
