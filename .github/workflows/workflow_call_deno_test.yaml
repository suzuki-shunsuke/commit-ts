name: deno test
on: workflow_call
jobs:
  test-deno:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.1
      - run: deno check
        env:
          AQUA_GITHUB_TOKEN: ${{github.token}}
      - run: deno lint
